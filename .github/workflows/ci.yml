name: Validate manifests

# Runs on every PR. This is the only gate between an open submission process and a registry full
# of unfalsifiable performance claims, so it must pass before anything merges.

on:
  pull_request:
    paths: ["packages/**", "validate.py"]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate every manifest
        run: python3 validate.py packages/
      - name: Self-test the validator
        run: python3 tests/test_validate.py
      - name: Self-test the discovery filters
        run: python3 tests/test_discover.py
