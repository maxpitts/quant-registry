name: Rebuild index

on:
  push:
    branches: [main]
    paths: ["packages/**", "build_index.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 validate.py packages/
      - run: python3 build_index.py
      - name: Attach public GitHub facts (stars, last push, default branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Done here, once, authenticated — not in the browser. api.github.com allows 60 calls
        # per hour per VIEWER IP, so a client-side version breaks on the first busy day.
        run: python3 enrich.py index.json
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "registry-bot"
          git config user.email "registry-bot@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet && { echo "index unchanged"; exit 0; }
          git commit -m "rebuild index"
          git push
